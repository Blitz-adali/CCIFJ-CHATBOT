[project]
name = "42asia-hackathon"
version = "0.1.0"
description = "Concierge chatbot to support CCIFJ website"
readme = "README.md"
authors = [
    { name = "Sara Ammourh", email = "saraammourh814@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "aiosqlite>=0.22.1",
    "bm25s>=0.3.15",
    "cohere>=7.3.0",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "fastapi>=0.158.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "sentence-transformers>=6.2.0",
    "transformers>=5.20.2",
    "tqdm",
    "pydantic>=2",
    "typing-extensions>=4",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
concierge = "concierge:main"
concierge-db = "concierge.db.relationaldb.migrate:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "concierge"

[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kan3nov", email = "shockrobot@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=10.2.0",
    "pydantic>=2.14.1",
    "sentence-transformers>=6.2.0",
    "transformers>=5.20.2",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
